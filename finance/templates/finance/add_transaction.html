{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Transaction - FinTrack</title>

    <link rel="stylesheet" href="{% static 'finance/style.css' %}">
</head>

<body>

    <nav class="navbar">
        <a class="brand" href="{% url 'dashboard' %}"><span class="brand-mark">F</span>FinTrack</a>

        <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
    </nav>

    <main class="container">

        <section class="transactions form-card">

            <h2>Add Transaction</h2>

            <form method="POST">

                {% csrf_token %}

                {{ form.non_field_errors }}
                {% for field in form %}
                    <div>
                        {{ field.label_tag }}
                        {{ field }}
                        {{ field.errors }}
                    </div>
                {% endfor %}

                <button class="primary-button" type="submit">
                    Add Transaction
                </button>

            </form>

        </section>

    </main>

</body>
</html>
