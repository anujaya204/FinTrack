{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Transaction - FinTrack</title>

    <link rel="stylesheet" href="{% static 'finance/style.css' %}">
</head>

<body>

    <nav class="navbar">
        <a class="brand" href="{% url 'dashboard' %}"><span class="brand-mark">F</span>FinTrack</a>

        <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
    </nav>

    <main class="container">

        <section class="transactions form-card">

            <h2>Add Transaction</h2>

            <form method="POST">

                {% csrf_token %}

                <div>
                    <label>Amount</label>
                    <input
                        type="number"
                        name="amount"
                        step="0.01"
                        required
                    >
                </div>

                <div>
                    <label>Transaction Type</label>
                    <select name="transaction_type" required>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>

                <div>
                    <label>Category</label>
                    <input
                        type="text"
                        name="category"
                        placeholder="e.g. Food, Salary, Transport"
                        required
                    >
                </div>

                <div>
                    <label>Date</label>
                    <input
                        type="date"
                        name="date"
                        required
                    >
                </div>

                <div>
                    <label>Description</label>
                    <textarea
                        name="description"
                        rows="4"
                        placeholder="Optional description"
                    ></textarea>
                </div>

                <button class="primary-button" type="submit">
                    Add Transaction
                </button>

            </form>

        </section>

    </main>

</body>
</html>
