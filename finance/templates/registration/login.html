{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - FinTrack</title>

    <link rel="stylesheet" href="{% static 'finance/style.css' %}">
</head>

<body>

    <nav class="navbar">
        <a class="brand" href="{% url 'login' %}"><span class="brand-mark">F</span>FinTrack</a>
    </nav>

    <main class="container">

        <section class="transactions form-card">

            <h2>Login</h2>

            <form method="POST" action="{% url 'login' %}">

                {% csrf_token %}

                <div>
                    <label>Username</label>

                    <input
                        type="text"
                        name="username"
                        required
                    >
                </div>

                <div>
                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        required
                    >
                </div>

                <button class="primary-button" type="submit">
                    Login
                </button>

            </form>
            <p class="form-note">Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>

        </section>

    </main>

</body>
</html>
